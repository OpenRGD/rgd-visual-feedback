name: VISUAL-RI-01 candidate boundary
on:
  pull_request:
    paths:
      - 'src/rgd_visual/**'
      - 'contracts/ri-status-report.v0.1-candidate.schema.json'
      - 'tests/test_ri_report.py'
      - 'tests/fixtures/ri/**'
      - '.github/workflows/visual-ri-candidate.yml'
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test-only schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Offline report projection and pinned candidate boundaries
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_ri_report.py -v
