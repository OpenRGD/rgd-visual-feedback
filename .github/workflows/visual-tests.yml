name: Visual Feedback offline tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.10 offline tests (no hardware)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Protocol and IPC tests
        run: python -m unittest discover -s tests -v
